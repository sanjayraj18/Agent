[project]
name = "agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "textual[syntax]>=1.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
agent = "agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
anyio_mode = "auto"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]
